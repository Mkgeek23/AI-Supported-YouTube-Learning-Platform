<!DOCTYPE html>
<html lang="en">
<head>
    <title>YouTube Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-container {
            margin-bottom: 25px;
        }

        #videoForm {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"],
        input[type="number"] {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"] {
            flex: 0 1 180px;
        }

        button[type="submit"] {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .info-display {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
        }

        .info-display p {
            color: #555;
            font-size: 14px;
            word-break: break-all;
        }

        .info-display strong {
            color: #333;
            font-weight: 600;
        }

        .info-display a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .info-display a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            #videoForm {
                flex-direction: column;
            }

            input[type="text"],
            input[type="number"],
            button[type="submit"] {
                width: 100%;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Video Player</h1>

        <div class="form-container">
            <form id="videoForm">
                <input type="text" id="videoUrl" placeholder="Paste YouTube URL here" required>
                <input type="number" id="startTime" placeholder="Start time (seconds)" min="0">
                <button type="submit">▶️ Play</button>
            </form>
        </div>

        <div class="info-display" id="currentVideoInfo">
<!--TODO: change the default url to any other you like -->
            <p><strong>Current Link:</strong> <a href="https://www.youtube.com/watch?v=aAItDrJ8-rE" id="currentUrl" target="_blank">
                https://www.youtube.com/watch?v=aAItDrJ8-rE</a></p>
        </div>

        <div class="video-container">
            <iframe
                id="videoFrame"
                width="100%"
                height="100%"
                src="https://www.youtube.com/embed/{{ video_id }}?start={{ start_time }}&rel=0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        // Update info display on a page load
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');
            const startTime = urlParams.get('t') || 0;

            if (videoId) {
                const url = `https://www.youtube.com/watch?v=${videoId}`;
                const urlElement = document.getElementById('currentUrl');
                urlElement.textContent = url;
                urlElement.href = url;
            }
        };

        document.getElementById('videoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const url = document.getElementById('videoUrl').value;
            const startTime = document.getElementById('startTime').value || 0;

            // Extract video ID from YouTube URL
            let videoId = '';
            try {
                const urlParams = new URL(url).searchParams;
                videoId = urlParams.get('v');

                if (!videoId) {
                    // Try to extract from other URL formats
                    const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?\s]{11})/);
                    videoId = match ? match[1] : '';
                }

                if (videoId) {
                    const youtubeUrl = `https://www.youtube.com/watch?v=${videoId}&t=${startTime}`;
                    const urlElement = document.getElementById('currentUrl');
                    urlElement.textContent = youtubeUrl;
                    urlElement.href = youtubeUrl;

                    // Update iframe src directly to start playing immediately
                    const iframe = document.getElementById('videoFrame');
                    iframe.src = `https://www.youtube.com/embed/${videoId}?start=${startTime}&rel=0&autoplay=1`;
                } else {
                    alert('Please enter a valid YouTube URL');
                }
            } catch (error) {
                alert('Please enter a valid URL');
            }
        });
    </script>
</body>
</html>
